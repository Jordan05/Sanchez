name: CI-CD

on:
  push:
    branches: [ "Sanchez" ]

jobs:

  build_and_push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # <-- NECESARIO PARA SUBIR LA IMAGEN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with correct tag
        run: |
          IMAGE_NAME="ghcr.io/jordan05/sanchez:1.0.5"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          docker build -t "$IMAGE_NAME" .

      - name: Push image to GHCR
        run: |
          docker push "$IMAGE_NAME"


  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Connect to VPS and update container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd ~/stack-sanchez
            docker compose down
            docker pull ghcr.io/jordan05/sanchez:1.0.5
            docker compose up -d --force-recreate
