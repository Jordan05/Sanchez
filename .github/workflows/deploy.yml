name: CI

on:
  push:
    branches: [ "Sanchez" ]
  pull_request:
    branches: [ "Sanchez" ]

jobs:
  test_build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      run: pytest -q

    - name: Build docker image
      run: docker build -t flask-ai-api .
